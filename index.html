<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Буквомобиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, bright, toy-box for a young driver
   IDEA: wooden alphabet blocks scattered over a toy island
   PICTURE: the live 3D island itself, full screen, letters as toy blocks
   COLOUR and TYPE: sky blue, sea teal, sunny yellow, tomato red; Nunito 900
   LAYOUT: full-bleed canvas, HUD chips in corners, title card centered */
:root{color-scheme:light;--sky:#8fd6ff;--ink:#14324a;--sun:#ffcf26;--red:#ff5a4e;--card:#fffdf6;--soft:#e6f3ff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font:700 16px/1.4 Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer;min-height:44px;min-width:44px;border-radius:14px;background:var(--soft)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.chip{position:fixed;background:var(--card);border-radius:18px;padding:8px 14px;box-shadow:0 4px 0 rgba(20,50,74,.25);font-weight:900;z-index:2}
#score{top:12px;left:12px;font-size:18px;display:flex;gap:8px;align-items:center}
#score b{font-size:26px;color:var(--red)}
#menuBtn{top:12px;right:12px;padding:8px 16px;background:var(--card)}
#fsBtn{top:12px;right:104px;padding:8px 11px;background:var(--card);display:grid;place-items:center}
#targetBox{top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;font-size:20px}
#tgtL{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;font-size:44px;line-height:1;color:#fff;background:var(--red);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
#targetBox button{padding:0 12px;font-size:15px}
#compass{position:fixed;top:100px;left:50%;width:76px;height:76px;margin-left:-38px;z-index:2;opacity:0;transition:opacity .3s;pointer-events:none}
#compass.on{opacity:1}
#compass svg{width:100%;height:100%;filter:drop-shadow(0 4px 0 rgba(20,50,74,.25))}
#arr{transform-origin:30px 30px;transition:transform .1s linear}
#card{position:fixed;left:16px;top:50%;z-index:3;transform-origin:left center;transform:translateY(-50%) scale(.5);opacity:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;pointer-events:none;background:var(--card);border-radius:30px;padding:16px 30px 18px;text-align:center;box-shadow:0 8px 0 rgba(20,50,74,.3);border:5px solid var(--sun);min-width:200px}
#card.on{opacity:1;transform:translateY(-50%) scale(1)}
@media(max-height:560px){#card.on{transform:translateY(-50%) scale(.72)}}
#card.bad{border-color:#b9c6d2}
#card .L{font-size:92px;line-height:1;font-weight:900}
#card .row{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}
#card .pic{font-size:56px;line-height:1}
#card .w{font-size:34px;font-weight:900}
#card .w b{color:var(--red)}
#card .ex{font-size:24px;color:#1f9d55;font-weight:900;margin-top:4px}
#card.bad .ex{color:#6b7d8d}
.pad{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));display:none;gap:14px;z-index:2}
body.touch .pad{display:flex}
#padL{left:18px}#padR{right:18px;align-items:flex-end}
.pad button{width:86px;height:86px;border-radius:50%;background:rgba(255,253,246,.9);box-shadow:0 6px 0 rgba(20,50,74,.3);display:grid;place-items:center;touch-action:none}
.pad button.on{transform:translateY(4px);box-shadow:0 2px 0 rgba(20,50,74,.3)}
.pad svg{width:40px;height:40px}
#gas{width:108px;height:108px;background:var(--sun)}
#rev{width:70px;height:70px}
#title{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;overflow:auto;background:linear-gradient(180deg,rgba(143,214,255,0),rgba(20,50,74,.35))}
.panel{background:var(--card);border-radius:32px;padding:clamp(20px,4vw,34px);max-width:640px;width:100%;box-shadow:0 10px 0 rgba(20,50,74,.3)}
h1{margin:0 0 4px;display:flex;flex-wrap:wrap;gap:5px;font-size:clamp(24px,6vw,44px);line-height:1;font-weight:900}
h1 span{display:grid;place-items:center;width:1.2em;height:1.2em;border-radius:.22em;color:#fff;box-shadow:inset 0 -.12em 0 rgba(0,0,0,.18)}
h1 span.sp{width:.4em;box-shadow:none}
.lbl{margin:16px 0 6px;font-size:15px;opacity:.7}
.seg{display:flex;gap:8px}
.seg button{flex:1;font-weight:900;font-size:18px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mode{text-align:left;padding:14px 16px;background:#eef8e8;border:3px solid transparent;border-radius:20px;font-size:15px;line-height:1.35}
.mode b{display:block;font-size:21px;margin-bottom:2px}
.mode[aria-pressed=true]{border-color:var(--ink);background:#fff2bd}
#go{width:100%;margin-top:18px;background:var(--red);color:#fff;font-size:26px;font-weight:900;padding:12px;border-radius:20px;box-shadow:0 6px 0 #b8322a}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 #b8322a}
.help{font-size:14px;opacity:.7;margin:12px 0 0;text-align:center}
.cars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.car{padding:4px 4px 8px;background:#eef6ff;border:3px solid transparent;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:900;line-height:1.15;text-align:center}
.car img{width:100%;aspect-ratio:8/5;object-fit:contain;display:block;border-radius:12px}
.car .wp{font-size:11px;font-weight:700;opacity:.75}
.car[aria-pressed=true]{border-color:var(--ink);background:#fff2bd}
.voice{display:flex;gap:8px}
.voice select{flex:1;font:inherit;font-size:15px;color:inherit;background:var(--soft);border:0;border-radius:14px;padding:0 12px;min-height:44px}
.voice button{padding:0 16px}
#horn{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:74px;height:74px;border-radius:50%;background:rgba(255,253,246,.9);box-shadow:0 6px 0 rgba(20,50,74,.3);font-size:34px;line-height:1;display:none;place-items:center;z-index:2;touch-action:none}
body.touch #horn{display:grid}
#horn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 rgba(20,50,74,.3)}
#map{position:fixed;top:64px;right:12px;width:150px;height:150px;border-radius:20px;background:var(--card);border:4px solid var(--card);box-shadow:0 4px 0 rgba(20,50,74,.25);z-index:2}
#banner{left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);opacity:0;transition:opacity .3s,transform .3s;font-size:22px;pointer-events:none;white-space:nowrap}
#banner.on{opacity:1;transform:translateX(-50%)}
body.touch #banner{bottom:136px}
#hp{top:64px;left:12px;display:flex;align-items:center;gap:8px;padding:6px 12px}
#hp .bar{width:110px;height:14px;border-radius:8px;background:#e3e9ef;overflow:hidden}
#hpBar{display:block;height:100%;width:100%;background:#22b356;border-radius:8px;transition:width .25s,background .25s}
#hp.low{animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#flash{position:fixed;inset:0;background:#fff3c4;opacity:0;pointer-events:none;z-index:4;transition:opacity .8s}
#flash.on{opacity:.9;transition:none}
#boom{position:fixed;inset:0;z-index:6;display:none;place-items:center;padding:16px;background:rgba(20,50,74,.35)}
#boom.on{display:grid}
#boom .panel{max-width:420px;text-align:center}
#boom .big{font-size:72px;line-height:1}
#boom h2{margin:8px 0 4px;font-size:30px;font-weight:900}
#boom p{margin:0 0 6px;font-size:20px}
#again{width:100%;margin-top:12px;background:var(--red);color:#fff;font-size:24px;font-weight:900;padding:12px;border-radius:20px;box-shadow:0 6px 0 #b8322a}
#codeIn{flex:1;font:inherit;font-size:26px;font-weight:900;letter-spacing:.3em;text-align:center;border:3px solid var(--ink);border-radius:14px;min-height:48px;padding:0 10px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text;touch-action:auto}
.neton{display:flex;align-items:center;gap:10px;background:#eef8e8;border-radius:16px;padding:10px 12px}
#netInfo{flex:1;font-size:15px;line-height:1.35}
#netInfo .code{font-size:30px;letter-spacing:.12em;color:var(--red)}
.neton button{padding:0 16px}
.netst{margin:6px 0 0;font-size:14px;color:#b8322a}
.netst:empty{display:none}
.seg button:disabled{opacity:.45;cursor:default}
.seg.gfx button{font-size:15px;padding:0 6px}
#netChip{top:112px;left:12px;font-size:16px;padding:6px 12px}
#fire{position:fixed;right:32px;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 124px);width:82px;height:82px;border-radius:50%;background:#ff5a4e;color:#fff;box-shadow:0 6px 0 #b8322a;font-size:36px;line-height:1;display:none;place-items:center;z-index:2;touch-action:none}
#fire{display:grid}
body:not(.touch) #fire{bottom:24px}
body:not(.touch) #fire::after{content:'пробел';position:absolute;right:-4px;bottom:-4px;font-size:13px;font-weight:900;background:var(--ink);color:#fff;border-radius:8px;padding:1px 7px}
#fire.on,#fire:active{transform:translateY(4px);box-shadow:0 2px 0 #b8322a}
#hitfx{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 20px rgba(255,40,30,.75);opacity:0;transition:opacity .35s;z-index:3}
#hitfx.on{opacity:1;transition:none}
#win{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:opacity .3s,transform .3s;font-size:40px;font-weight:900;padding:18px 30px;border-radius:26px;background:var(--card);box-shadow:0 8px 0 rgba(20,50,74,.25);pointer-events:none;z-index:4;white-space:nowrap}
#win.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#netChip .pl{display:inline-flex;align-items:center;gap:5px;margin-right:10px;font-size:20px}
#netChip .pl i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-style:normal;font-size:14px}
#netChip .pl.me{text-decoration:underline;text-underline-offset:4px}
#netChip .goal{opacity:.6;font-size:15px}
#nameIn{width:100%;box-sizing:border-box;font:inherit;font-size:18px;font-weight:900;border:3px solid #d6e2ec;border-radius:14px;min-height:46px;padding:0 14px;margin-bottom:8px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text;touch-action:auto}
#micBtn{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:70px;height:70px;border-radius:50%;background:rgba(255,253,246,.92);box-shadow:0 6px 0 rgba(20,50,74,.3);font-size:32px;line-height:1;display:grid;place-items:center;z-index:2;touch-action:none}
#micBtn.on{background:#ff5a4e;box-shadow:0 0 0 8px rgba(255,90,78,.35),0 2px 0 #b8322a;transform:translateX(-50%) translateY(4px)}
body:not(.touch) #micBtn::after{content:'V';position:absolute;right:-4px;bottom:-4px;font-size:13px;font-weight:900;background:var(--ink);color:#fff;border-radius:8px;padding:1px 7px}
body.touch #fire{right:auto;left:218px;bottom:max(18px,env(safe-area-inset-bottom))}
body.touch #horn{left:auto;right:38px;transform:none;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 124px)}
body.touch #horn:active{transform:translateY(4px)}
body.touch #banner{bottom:110px}
body.menu .hud{display:none!important}
body:not(.menu) #title{display:none}
[hidden]{display:none!important}
@media(max-width:600px){#win{font-size:28px}#fire{width:70px;height:70px;font-size:30px;right:36px;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 120px)}#hp .bar{width:80px}#card{top:160px!important}#map{width:104px;height:104px;top:150px}#card{top:132px;transform-origin:left top;transform:scale(.5);padding:10px 18px 12px;min-width:0}#card.on{transform:scale(1)}#card .pic{font-size:40px}.modes{grid-template-columns:minmax(0,1fr)}.cars{grid-template-columns:repeat(3,minmax(0,1fr))}#score{font-size:15px}#score b{font-size:22px}#targetBox{top:64px;font-size:17px}#tgtL{width:50px;height:50px;font-size:36px}#compass{top:136px}#card .L{font-size:72px}#card .w{font-size:28px}.pad button{width:74px;height:74px}#gas{width:94px;height:94px}}
/* phones (also lying sideways): smaller buttons and hints so the road stays visible */
@media (max-height:500px),(max-width:600px){
  .chip{padding:5px 10px;border-radius:14px;box-shadow:0 3px 0 rgba(20,50,74,.25)}
  #score{top:8px;left:8px;font-size:13px;gap:6px}#score b{font-size:18px}
  #hp{top:42px;left:8px;padding:4px 9px;gap:5px}#hp .bar{width:64px;height:9px}
  #netChip{top:74px;left:8px;font-size:13px;padding:4px 10px}#netChip .pl{font-size:14px;margin-right:7px}#netChip .pl i{width:18px;height:18px;font-size:11px}
  #menuBtn{top:8px;right:8px;padding:5px 11px;font-size:13px}#fsBtn{top:8px;right:72px;padding:5px 8px}#fsBtn svg{width:16px;height:16px}
  #map{width:92px;height:92px;top:42px;right:8px;border-width:3px;border-radius:14px}
  #targetBox{top:8px;font-size:13px;gap:6px;padding:4px 6px 4px 10px}#tgtL{width:36px;height:36px;font-size:25px;border-radius:10px}#targetBox button{font-size:12px;padding:0 8px;min-height:30px}#targetBox #repeat svg{width:18px;height:18px}
  #compass{top:52px;width:48px;height:48px;margin-left:-24px}
  #card{padding:6px 14px 8px;min-width:0;border-width:4px;border-radius:20px;top:50%!important}#card .L{font-size:48px}#card .pic{font-size:28px}#card .w{font-size:19px}#card .ex{font-size:14px}
  #banner{font-size:14px}body.touch #banner{bottom:92px}#win{font-size:24px;padding:12px 20px}
  .pad{gap:10px}.pad button{width:62px;height:62px}.pad svg{width:28px;height:28px}#gas{width:80px;height:80px}#rev{width:54px;height:54px}
  body.touch #fire{left:162px;width:62px;height:62px;font-size:28px}
  body.touch #horn{width:50px;height:50px;font-size:22px;right:30px;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 96px)}
  #micBtn{width:56px;height:56px;font-size:26px}
}
/* narrow phone held upright: the fire button sits above the steering buttons */
@media (max-width:430px){body.touch #fire{left:44px;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 76px)}body.touch #micBtn{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 84px)}}
/* video squares of the players who turned their camera on */
#camBtn{position:fixed;left:calc(50% + 46px);bottom:max(18px,env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:rgba(255,253,246,.92);box-shadow:0 5px 0 rgba(20,50,74,.3);font-size:26px;line-height:1;display:grid;place-items:center;z-index:2;touch-action:none}
#camBtn.on{background:#22b356;box-shadow:0 0 0 6px rgba(34,179,86,.35),0 2px 0 #157a39}
#camBtn.on::before{content:'';position:absolute;inset:0}
#vids{position:fixed;top:236px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:2;pointer-events:none}
#vids .vt{position:relative;width:120px;height:90px;border-radius:14px;overflow:hidden;background:#20313f;border:3px solid var(--card);box-shadow:0 3px 0 rgba(20,50,74,.25)}
#vids .vt.talk{border-color:#ff5a4e;box-shadow:0 0 0 4px rgba(255,90,78,.45)}
#vids video{width:100%;height:100%;object-fit:cover;display:block}
#vids .vt.me video{transform:scaleX(-1)}
#vids .vt span{position:absolute;left:4px;bottom:3px;font-size:11px;font-weight:800;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:0 5px;max-width:90%;overflow:hidden;white-space:nowrap}
@media (max-height:500px),(max-width:600px){#vids{top:142px;right:8px;gap:6px}#vids .vt{width:68px;height:51px;border-width:2px;border-radius:10px}#camBtn{width:50px;height:50px;font-size:22px;left:calc(50% + 38px)}}
/* phone lying sideways: a row at the top, left of the map, away from the pedals */
@media (max-height:500px){#vids{top:42px;right:108px;flex-direction:row-reverse;flex-wrap:wrap;max-width:300px}}
@media (max-width:430px){body.touch #camBtn{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 88px)}}
@media(prefers-reduced-motion:reduce){#card,#arr{transition:none}}
</style>
</head>
<body class="menu">
<canvas id="c"></canvas>

<div id="score" class="chip hud"><span id="scoreL">Сбито</span><b id="scoreN">0</b></div>
<div id="hp" class="chip hud" aria-label="Прочность машины"><span>❤️</span><div class="bar"><i id="hpBar"></i></div></div>
<div id="flash"></div>
<div id="netChip" class="chip hud" hidden></div>
<div id="boom" class="hud"><div class="panel"><div class="big">💥</div><h2 data-t="boomT">Бабах!</h2><p id="boomScore"></p><button id="again" data-t="again">Поехали снова!</button></div></div>
<button id="menuBtn" class="chip hud" data-t="menu">Меню</button>
<button id="fsBtn" class="chip hud" aria-label="Весь экран"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<div id="targetBox" class="chip hud" hidden>
  <span data-t="findL">Найди</span>
  <div id="tgtL">А</div>
  <button id="repeat" aria-label="Повторить"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
  <button id="hintBtn" data-t="hint">Подсказка</button>
</div>
<div id="compass" class="hud"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="#fffdf6"/><path id="arr" d="M30 7 L45 41 L30 33 L15 41Z" fill="#ff5a4e"/></svg></div>
<div id="card"></div>
<canvas id="map" class="hud" width="300" height="300" aria-hidden="true"></canvas>
<div id="banner" class="chip hud"></div>

<div id="padL" class="pad hud">
  <button data-k="l" aria-label="Влево"><svg viewBox="0 0 24 24"><path d="M15 4 L6 12 L15 20Z" fill="#14324a"/></svg></button>
  <button data-k="r" aria-label="Вправо"><svg viewBox="0 0 24 24"><path d="M9 4 L18 12 L9 20Z" fill="#14324a"/></svg></button>
</div>
<div id="padR" class="pad hud">
  <button id="rev" data-k="d" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M4 9 L12 18 L20 9Z" fill="#14324a"/></svg></button>
  <button id="gas" data-k="u" aria-label="Газ"><svg viewBox="0 0 24 24"><path d="M4 16 L12 6 L20 16Z" fill="#14324a"/></svg></button>
</div>

<button id="horn" class="hud" aria-label="Сигнал">📢</button>
<button id="fire" class="hud" aria-label="Огонь">💥</button>
<button id="micBtn" class="hud" hidden aria-label="Держи, чтобы говорить">🎙️</button>
<button id="camBtn" class="hud" hidden aria-label="Камера">📷</button>
<div id="vids" class="hud"></div>
<div id="hitfx"></div>
<div id="win" role="status"></div>
<div id="title">
  <div class="panel">
    <h1 id="h1" aria-label="Буквомобиль"></h1>
    <div class="lbl" data-t="carL">Машина</div>
    <div class="cars" id="cars"></div>
    <div class="lbl" data-t="langL">Буквы</div>
    <div class="seg" id="langSeg">
      <button data-lang="ru" aria-pressed="true">Русские</button>
      <button data-lang="en" aria-pressed="false">English</button>
    </div>
    <div class="lbl" data-t="modeL">Режим</div>
    <div class="modes">
      <button class="mode" data-mode="free" aria-pressed="true"><b data-t="free">Катаемся</b><span data-t="freeD"></span></button>
      <button class="mode" data-mode="find" aria-pressed="false"><b data-t="find">Найди букву</b><span data-t="findD"></span></button>
      <button class="mode" data-mode="race" aria-pressed="false"><b data-t="race">Гонка</b><span data-t="raceD"></span></button>
    </div>
    <div class="lbl" data-t="voiceL">Голос</div>

function morphCar(C,m){
  const sm=k=>{k=Math.max(0,Math.min(1,k));return k*k*(3-2*k)};
  const sw=Math.sin(C.ph)*.5*C.walk;
  for(const P of C.parts){
    const e=sm((m-P.d)/.48);
    P.o.position.lerpVectors(P.tp,P.rp,e);
    /* parts hop up a little in the middle of the move, so they don't cut through each other */
    P.o.position.y+=Math.sin(e*Math.PI)*.5;
    let rx=P.tr[0]+(P.rr[0]-P.tr[0])*e;
    if(P.leg)rx+=sw*P.leg*e;                                  /* legs step */
    if(P.arm)rx+=(-sw*P.arm*.7*(1-C.aim)-Math.PI/2*C.aim)*e;  /* arms swing, or point forward to shoot */
    P.o.rotation.set(rx,P.tr[1]+(P.rr[1]-P.tr[1])*e,P.tr[2]+(P.rr[2]-P.tr[2])*e);
    /* the body bobs with every step; feet stay on the ground */
    if(!P.leg)P.o.position.y-=Math.abs(sw)*.18*e;
  }
  const b=sm((m-.85)/.15);
  for(const a of C.arms)a.brl.position.y=-1.3-b*.95+a.rec*.3;
}

}
function fxRing(pos,r){

/* a proper explosion: flash, fire ball, sparks, shock ring and rolling smoke (size 1 = rocket) */

  for(let i=0;i<Math.round(11*size);i++)fxSpawn({pos:jit(P,.7*size),v:new THREE.Vector3(rnd(-5,5)*size,rnd(1.5,6)*size,rnd(-5,5)*size),T:rnd(.45,.85),s0:1.6*size,s1:rnd(4.5,7.5)*size,op:.95,c0:0xffd24a,c1:0xb8280a,puff:true,drag:3,g:-3,spin:2.5});

function updFx(dt){
  for(const p of fxs){
    if(!p.s.visible)continue;
    p.t+=dt;if(p.t<0)continue;
    const k=p.t/p.T;if(k>=1){p.s.visible=false;continue}
    p.v.y-=p.g*dt;if(p.drag)p.v.multiplyScalar(Math.max(0,1-p.drag*dt));p.s.position.addScaledVector(p.v,dt);
    p.s.scale.setScalar(p.s0+(p.s1-p.s0)*(1-(1-k)*(1-k)));
    const m=p.s.material;m.color.copy(p.c0).lerp(p.c1,k);m.opacity=p.op*(k<.08?k/.08:1-(k-.08)/.92);m.rotation+=p.rs*dt;
  }
  for(const R of fxRings){if(!R.m.visible)continue;R.t+=dt;const k=R.t/R.T;if(k>=1){R.m.visible=false;continue}R.m.scale.setScalar(.5+R.r*(1-(1-k)*(1-k)));R.m.material.opacity=.7*(1-k)}

}

/* the car gets darker as it gets hurt */

function setDamageLook(){

    const base=o.userData.base;
    if(!st||!base.color||CAR.blink.includes(base)){o.material=base;return}

    if(!m){m=base.clone();m.color.multiplyScalar(st===1?.72:.45);darkMats.set(key,m)}

/* break a tree or a rock if the hit is hard enough */

  if(o.kind==='tree'&&imp>(crush||11)){smash(o,dx,dz);return true}
  if(o.kind==='rock'&&imp>(o.big?(tank?9:1e9):(tank?4:15))){smash(o,dx,dz);return true}

}
function hideInst(o){

}
function smash(o,dx,dz,fromNet){

const _fq=new THREE.Quaternion();
function updFalling(dt){

/* I bumped a letter: a joined player asks the host, the host (or a solo player) decides right away */
function hit(L,nx,nz,remote){
  const sp=remote?14:Math.abs(car.v),hx=remote?nx:Math.sin(car.h),hz=remote?nz:Math.cos(car.h);
  if(isClient()){if(L.cool>0)return;L.cool=.8;netSend({t:'hit',li:L.i,nx,nz,r:!!remote,sp,hx,hz});return}
  resolveHit(L,nx,nz,remote,myId(),sp,hx,hz);
}
function resolveHit(L,nx,nz,remote,by,sp,hx,hz){
  /* a friend's screen may show the letter landed a moment earlier than mine */
  if(!(L.state==='idle'||L.state==='wob'||(by!==myId()&&L.state==='fall'&&L.t>.75))||L.cool>0)return;
  if(mode!=='free'&&!target)return;
  const ok=mode==='free'||L.d===target;
  if(ok){score++;if(mode!=='free')nextT=3.4}
  const e={t:'res',li:L.i,ok,nx,nz,r:!!remote,by,sp,hx,hz,g:Math.floor(Math.random()*Tx().good.length),score};
  if(ok&&mode==='race'){const b=board.get(by)||{num:numOf(by),n:0};b.n++;board.set(by,b);e.sc=boardArr();if(b.n>=WIN)e.win=by}
  hitFx(e);netSend(e);
}
function hitFx(e){
  const L=letters[e.li];if(!L)return;
  const me=e.by===myId();score=e.score;if(e.sc)setBoard(e.sc);updScore();
  if(e.ok){
    L.state='fly';L.t=1.3;L.mesh.visible=true;L.mark.visible=false;
    L.vel.set(e.nx*(6+e.sp*.6)+e.hx*e.sp*.4,9+e.sp*.35,e.nz*(6+e.sp*.6)+e.hz*e.sp*.4);
    L.spin.set(rnd(-8,8),rnd(-8,8),rnd(-8,8));
    burst(L.mesh.position,[L.c,'#ffffff'],22,1);if(me&&!e.r)car.v*=.8;repair(8);
    if(mode==='free'){showCard(L.d,'good');say(Tx().phrase(L.d));popSnd()}
    else{
      const g=mode==='race'&&!me?Tx().gotIt(nameOf(e.by)):Tx().good[e.g]||Tx().good[0];showCard(L.d,me||mode!=='race'?'good':'bad',g);
      if(e.win)raceWin(e.win);else{say(Tx().phrase(L.d)+' '+g);if(me||mode!=='race')winSnd();else badSnd()}

    }

    L.state='wob';L.t=.7;L.cool=1.6;

function setTarget(li){

/* the letter to find lands somewhere on the whole island, far from every player */
function farSpot(L){
  const P=players(),c=[];
  for(let i=0;i<900&&c.length<60;i++){
    const a=rnd(0,TAU),r=Math.sqrt(Math.random())*R*.9,x=Math.cos(a)*r,z=Math.sin(a)*r;
    const h=goodSpot(x,z,L);if(h===null)continue;
    const d=P.length?Math.min(...P.map(p=>Math.hypot(p.x-x,p.z-z))):99;
    if(d<40)continue;c.push({x,z,h,d});
  }
  if(!c.length)return null;
  c.sort((a,b)=>b.d-a.d);return pick(c.slice(0,Math.max(1,Math.ceil(c.length/4))));
}
function nextTarget(){
  const pool=letters.filter(l=>l.d!==lastT&&l.state!=='fly'&&l.state!=='fall');if(!pool.length){nextT=1;return}
  const L=pick(pool),s=farSpot(L);
  if(s)drop(L,s);else if(!dropNear(L,35,65)){nextT=1;return}
  setTarget(L.i);netSend({t:'target',li:L.i});
}
function updFind(dt){
  if(nextT>0){if(isClient())return;nextT-=dt;if(nextT<=0)nextTarget();return}
  if(!target)return;
  hintT+=dt;
  const show=hintOn||hintT>25,cp=$('#compass');cp.classList.toggle('on',show);
  if(show){
    const L=letters.find(l=>l.d===target);if(!L)return;
    let rel=Math.atan2(L.x-car.x,L.z-car.z)-car.h;
    rel=Math.atan2(Math.sin(rel),Math.cos(rel));

  }
}

async function hostGame(){

  const n={role:'host',ready:false,conns:new Map(),known:new Map(),num:1,next:2,count:1,me:'h'+rid()};net=n;joinOpen=false;netStatus('');updNetUI();
  netStep(n,'1/3 загружаю связь');

  for(let i=0;i<BROKERS.length&&net===n;i++){
    netStep(n,'2/3 сервер '+(i+1));
    let c;try{c=await mqConnect(i)}catch(e){continue}
    if(net!==n){c.end(true);return}
    n.mq=c;n.code=String(1+i*3+Math.floor(Math.random()*3))+String(Math.floor(Math.random()*1000)).padStart(3,'0');
    n.base=TOPIC+n.code+'/';listen();netStep(n,'3/3 подписка');
    let subd=false;const ok=()=>{if(subd||net!==n)return;subd=true;n.ready=true;updNetUI();say(Tx().code+': '+n.code.split('').join(' '))};
    try{c.subscribe([n.base+'h',n.base+'c'],{qos:0},ok)}catch(e){}

function hostData(d){

    if(d.ver!==NET_VER){pub('c/'+d.f,{t:'ver'});return}

    if(!p){if(net.conns.size>=3){pub('c/'+d.f,{t:'full'});return}const k=net.known.get(d.f);p={num:k?k.num:net.next++,seen:time};net.conns.set(d.f,p);net.known.set(d.f,{num:p.num})}
    p.nm=cleanName(d.nm)||(net.known.get(d.f)||{}).nm||'';net.known.get(d.f).nm=p.nm;
    p.seen=time;net.count=1+net.conns.size;
    pub('c/'+d.f,{t:'hi',num:p.num,code:net.code,host:net.me,lang,mode,score,count:net.count,target:target?letters.findIndex(l=>l.d===target):-1,sc:boardArr(),L:lettersSnap(),D:destroyed.map(o=>[o.idx,o.x,o.z])});
    if(!p.told){p.told=true;hostBroadcast({t:'pl',n:net.count});showBanner(Tx().joinedMsg(p.nm||Tx().pl(p.num)));updNetUI()}
    return;
  }
  const p=net.conns.get(d.f);
  /* a player I thought had left is still playing (their phone paused for a while): let them back in with a fresh copy of the game */
  if(!p){const k=net.known.get(d.f);if(k&&d.t!=='bye')hostData({t:'join',f:d.f,id:d.f,ver:NET_VER,nm:k.nm});return}
  p.seen=time;

async function joinGame(code){

  const n={role:'client',ready:false,code,count:1,me:'c'+rid()};net=n;netStatus('');updNetUI();
  netStep(n,'1/4 загружаю связь');

  const bi=Math.min(BROKERS.length-1,Math.floor((+code[0]-1)/3));
  netStep(n,'2/4 сервер '+(bi+1));
  let c;try{c=await mqConnect(bi)}catch(e){if(net===n)netFail(Tx().netFail+' [шаг 2, сервер '+(bi+1)+']');return}
  if(net!==n){c.end(true);return}
  n.mq=c;n.base=TOPIC+code+'/';listen();

    const ask=()=>{if(net===n&&!n.ready)pub('h',{t:'join',ver:NET_VER,nm:myName})};
    ask();setTimeout(ask,2500);setTimeout(ask,5000);
    setTimeout(()=>{if(net===n&&!n.ready)netFail(Tx().notFound+' [шаг 4]')},10000);
  };

  setTimeout(go,4000);
}
function clientData(d){
  if(d.t==='shot'||d.t==='dmg'||d.t==='kill'||d.t==='pulse'||d.t==='rtc'||d.t==='talk'||d.t==='cam'){if(d.f===net.host)net.hostSeen=time;peerMsg(d);return}
  if(d.t==='car'||d.t==='smash'||d.t==='horn'||d.t==='bye'){
    if(d.f===net.host)net.hostSeen=time;
    if(d.t==='car')remoteState(d);else if(d.t==='smash')netSmash(d);else if(d.t==='horn')remoteHorn(d);
    else if(d.f===net.host)lostHost();else removeRemote(d.f);
    return;
  }
  if(net.ready&&d.f!==net.host)return;
  net.hostSeen=time;
  switch(d.t){
    case 'ver':netFail(Tx().verMsg);break;
    case 'full':netFail(Tx().fullMsg);break;
    case 'hi':{
      /* the first hi starts my game; a later one (after the host lost me for a while) just brings everything up to date */
      const first=!net.ready;
      if(!first&&d.f!==net.host)break;
      net.ready=true;net.num=d.num;net.count=d.count;net.host=d.f;net.hostSeen=time;
      lang=d.lang==='en'?'en':'ru';mode=['find','race'].includes(d.mode)?d.mode:'free';applyTexts();
      if(builtLang!==lang)buildLetters();
      if(!first){score=d.score|0;setBoard(d.sc);applySnap(d.L);for(const [i,x,z] of d.D||[]){const o=findObst(i,x,z);if(o&&!o.dead)hideInst(o)}
        target=d.target>=0&&letters[d.target]?letters[d.target].d:null;if(target)$('#tgtL').textContent=target[0];
        $('#scoreL').textContent=mode==='free'?Tx().hit:Tx().got;$('#targetBox').hidden=mode==='free';updNetUI();break}
      score=d.score|0;setBoard(d.sc);applySnap(d.L);
      for(const [i,x,z] of d.D||[]){const o=findObst(i,x,z);if(o&&!o.dead)hideInst(o)}
      target=d.target>=0&&letters[d.target]?letters[d.target].d:null;if(target)$('#tgtL').textContent=target[0];
      updNetUI();startGame();showBanner(Tx().youAre(d.num)+'!');
      if(target)setTimeout(()=>say(Tx().ask(target)),900);
      break;}
    case 'pl':net.count=d.n;updNetUI();break;
    case 'set':{
      const lc=lang!==d.lang;lang=d.lang==='en'?'en':'ru';mode=['find','race'].includes(d.mode)?d.mode:'free';applyTexts();if(lc)buildLetters();
      target=null;board.clear();updScore();$('#scoreL').textContent=mode==='free'?Tx().hit:Tx().got;$('#targetBox').hidden=mode==='free';$('#compass').classList.remove('on');break;}
    case 'L':applySnap(d.a);break;
    case 'res':hitFx(d);break;
    case 'target':setTarget(d.li);break;
    case 'gone':if(d.who===net.me)pub('h',{t:'join',ver:NET_VER,nm:myName});else removeRemote(d.who);break;
    case 'board':setBoard(d.sc);break;
  }
}

    r.cur.h+=Math.atan2(Math.sin(t[3]-r.cur.h),Math.cos(t[3]-r.cur.h))*k;r.cur.p+=(t[4]-r.cur.p)*k;r.cur.ro+=(t[5]-r.cur.ro)*k;

/* the car I am aiming at: a little help so kids can hit something */
function aimTarget(ox,oz,yaw,cone,maxD){
  let best=null,bs=1e9;
  for(const [id,r] of remotes){
    if(!r.C.g.visible)continue;
    const dx=r.cur.x-ox,dz=r.cur.z-oz,d=Math.hypot(dx,dz);if(d>(maxD||140)||d<2)continue;
    const a=Math.atan2(dx,dz),da=Math.abs(Math.atan2(Math.sin(a-yaw),Math.cos(a-yaw)));
    if(da<(cone||.26)&&da*d<bs){bs=da*d;best={id,r,d}}
  }
  return best;
}
function fire(){

  if(W.arms&&CAR.morph<.95){if(Math.abs(car.v)<1&&!inp.u&&!inp.d)CAR.idle=1;return}
  fireCool=W.cd;
  if(W.pulse){shotSnd(w);pulseFx(car.x,car.y,car.z,myId());netSend({t:'pulse',p:[r2(car.x),r2(car.y),r2(car.z)]});return}

  if(CAR.turret){yaw=car.h+CAR.turret.rotation.y;CAR.recoil=1;CAR.muzzle.getWorldPosition(pv);ox=pv.x;oy=pv.y;oz=pv.z}
  else if(CAR.arms){CAR.aimT=1.6;if(CAR.aim<.9){CAR.aim=1;morphCar(CAR,CAR.morph);CAR.g.updateMatrixWorld(true)}const a=CAR.arms[CAR.side^=1];a.rec=1;a.muzzle.getWorldPosition(pv);ox=pv.x;oy=pv.y;oz=pv.z}
  else{const fx=Math.sin(car.h),fz=Math.cos(car.h);ox=car.x+fx*2.4;oy=car.y+(CAR.S.cam[1]>7?3.2:1.8);oz=car.z+fz*2.4}
  let pitch=W.water?.12:0;
  const tg=aimTarget(ox,oz,yaw,W.rocket?.7:.26)||(CAR.turret?aimTarget(car.x,car.z,car.h):null);
  if(tg&&CAR.turret){CAR.turret.rotation.y=Math.atan2(tg.r.cur.x-car.x,tg.r.cur.z-car.z)-car.h;CAR.muzzle.getWorldPosition(pv);ox=pv.x;oy=pv.y;oz=pv.z}
  if(tg&&!W.rocket){yaw=Math.atan2(tg.r.cur.x-ox,tg.r.cur.z-oz);const tt=tg.d/W.sp;pitch=Math.atan2(tg.r.cur.y+1.2-oy+W.g*tt*tt/2,tg.d)}
  if(W.spread)yaw+=rnd(-W.spread,W.spread);
  if(W.rocket){pitch=.06;if(tg){const a=Math.atan2(tg.r.cur.x-ox,tg.r.cur.z-oz);yaw=a+Math.atan2(Math.sin(yaw-a),Math.cos(yaw-a))*.4}}

/* electric pulse: a blue ring and lightning to every car close by */
const ringGeo=new THREE.RingGeometry(.85,1,48);ringGeo.rotateX(-Math.PI/2);
const boltGeo=new THREE.BoxGeometry(.18,.18,1);boltGeo.translate(0,0,.5);
function bolt(ax,ay,az,bx,by,bz){
  const g=new THREE.Group(),mat=new THREE.MeshBasicMaterial({color:0xcff6ff}),glow=new THREE.MeshBasicMaterial({color:0x4cc9ff,transparent:true,opacity:.5,depthWrite:false});
  let px=ax,py=ay,pz=az;const N=7;
  for(let i=1;i<=N;i++){
    const f=i/N,j=i<N?1.4:0,nx=ax+(bx-ax)*f+rnd(-j,j),ny=ay+(by-ay)*f+rnd(-j,j)*.6,nz=az+(bz-az)*f+rnd(-j,j);
    const len=Math.hypot(nx-px,ny-py,nz-pz);
    for(const [m,sc] of [[mat,1],[glow,3]]){const seg=new THREE.Mesh(boltGeo,m);seg.position.set(px,py,pz);seg.scale.set(sc,sc,len);pv.set(nx,ny,nz);seg.lookAt(pv);g.add(seg)}
    px=nx;py=ny;pz=nz;
  }
  scene.add(g);zaps.push({o:g,t:.3,mats:[mat,glow]});
}
function pulseFx(x,y,z,owner){
  const W=WEAP.monster,mat=new THREE.MeshBasicMaterial({color:W.col,transparent:true,opacity:.85,side:THREE.DoubleSide,depthWrite:false});
  const ring=new THREE.Mesh(ringGeo,mat);ring.position.set(x,y+.6,z);scene.add(ring);zaps.push({o:ring,t:.45,T:.45,ring:true,mats:[mat],R:W.rad});
  pv.set(x,y+1.5,z);burst(pv,['#cff6ff','#4cc9ff','#ffffff'],12,.6);
  const mine=owner===myId();
  for(const [id,r] of remotes){
    if(id===owner||!r.C.g.visible)continue;
    const d=Math.hypot(r.cur.x-x,r.cur.z-z);if(d>W.rad)continue;
    bolt(x,y+2.5,z,r.cur.x,r.cur.y+1.4,r.cur.z);

}

        const n=Math.hypot(s.vx,s.vy,s.vz)||1;s.vx*=sp/n;s.vy*=sp/n;s.vz*=sp/n;
      }
